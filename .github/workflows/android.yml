name: Android

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Debug
        run: ./gradlew :catalog:androidApp:assembleDebug :catalog:assemble :icons:assemble :illustrations:assemble :ui:assemble

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            catalog/androidApp/build/outputs/apk/
            **/build/outputs/aar/
            **/build/libs/*-android.jar
          retention-days: 30
